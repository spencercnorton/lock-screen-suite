name: Bug report
description: The lock screen shows the wrong wallpaper, clock or weather, or something is left behind after disabling.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove machine names, user names, personal paths, photos and your location from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: After waking from suspend, the weather showed yesterday's temperature.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Output of `gnome-shell --version` and the number of monitors.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines from `journalctl --user -b | grep -i lock-screen-suite`, scrubbed.
      render: text
